memory_limit = 512M
upload_max_filesize = 12M
post_max_size = 12M
max_execution_time = 120
expose_php = Off
date.timezone = UTC

opcache.enable = 1
opcache.enable_cli = 0
; Development: re-check files on every request so code edits apply immediately.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
