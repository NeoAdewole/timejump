name: timejump

x-php: &php
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  image: timejump-php:latest
  volumes:
    - ./:/var/www/html
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  # PHP-FPM running the Laravel API. Installs dependencies and migrates on first boot.
  app:
    <<: *php
    environment:
      CONTAINER_ROLE: app

  # Processes calendar sync jobs.
  queue:
    <<: *php
    environment:
      CONTAINER_ROLE: queue
    command: ["php", "artisan", "queue:work", "--tries=3", "--sleep=3", "--max-time=3600"]

  # Runs the Laravel scheduler (periodic calendar sync).
  scheduler:
    <<: *php
    environment:
      CONTAINER_ROLE: scheduler
    command: ["php", "artisan", "schedule:work"]

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-timejump}
      MYSQL_USER: ${DB_USERNAME:-timejump}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "${FORWARD_DB_PORT:-33060}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
